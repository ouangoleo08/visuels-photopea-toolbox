<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>VISUELS STUDIO 226 - Photopea Toolbox</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:10px;
    width:320px;
    background:#07111f;
    color:#fff;
    font-family:Arial,sans-serif;
}

.header{
    text-align:center;
    padding:12px;
    margin-bottom:9px;
    border-radius:12px;
    background:linear-gradient(135deg,#071a31,#0d4773);
    border:1px solid #17689a;
}

.logo{
    font-size:17px;
    font-weight:900;
    letter-spacing:.8px;
}

.subtitle{
    color:#73d9ff;
    font-size:10px;
    margin-top:4px;
}

.section{
    background:#0b1b2d;
    border:1px solid #173650;
    border-radius:10px;
    padding:8px;
    margin-bottom:8px;
}

.title{
    color:#6edcff;
    font-size:10px;
    font-weight:bold;
    margin-bottom:7px;
    text-transform:uppercase;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:5px;
}

button{
    border:0;
    border-radius:7px;
    padding:9px 4px;
    background:#122b43;
    color:#fff;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d557c;
}

.blue{
    background:#086da5;
}

.gold{
    background:#9a6700;
}

.purple{
    background:#67328d;
}

.green{
    background:#16744d;
}

.red{
    background:#9a3030;
}

input{
    width:100%;
    padding:8px;
    border-radius:7px;
    border:1px solid #244762;
    background:#06121f;
    color:#fff;
    outline:none;
    margin-bottom:6px;
}

.status{
    text-align:center;
    font-size:10px;
    color:#72e2a4;
    padding:4px;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">VISUELS STUDIO 226</div>
    <div class="subtitle">PHOTOPEA TOOLBOX</div>
</div>


<!-- MODELES -->

<div class="section">

<div class="title">🎨 Modèles d'affiches</div>

<div class="grid">

<button class="blue" onclick="modelePromo()">🔥 PROMO</button>

<button class="blue" onclick="modeleFormation()">🎓 FORMATION</button>

<button class="blue" onclick="modeleRestaurant()">🍔 RESTAURANT</button>

<button class="blue" onclick="modeleBusiness()">💼 BUSINESS</button>

<button class="blue" onclick="modeleTelephone()">📱 TÉLÉPHONE</button>

<button class="blue" onclick="modeleEvenement()">🎉 ÉVÉNEMENT</button>

<button class="blue" onclick="modeleAnniversaire()">🎂 ANNIVERSAIRE</button>

</div>
</div>


<!-- STICKERS -->

<div class="section">

<div class="title">🏷️ Stickers</div>

<div class="grid">

<button class="gold" onclick="sticker('PROMO')">PROMO</button>

<button class="gold" onclick="sticker('-30%')">-30%</button>

<button class="gold" onclick="sticker('-50%')">-50%</button>

<button class="gold" onclick="sticker('OFFRE')">OFFRE</button>

<button class="gold" onclick="sticker('GRATUIT')">GRATUIT</button>

</div>
</div>


<!-- TEXTE -->

<div class="section">

<div class="title">🔤 Texte professionnel</div>

<input id="texte" placeholder="Écris ton texte ici">

<div class="grid">

<button onclick="texteNormal()">➕ TEXTE</button>

<button onclick="texteXXL()">🔠 XXL</button>

<button class="purple" onclick="texte3D()">🧊 3D</button>

</div>
</div>


<!-- EFFETS -->

<div class="section">

<div class="title">✨ Effets</div>

<div class="grid">

<button onclick="dupliquer()">📋 Dupliquer</button>

<button onclick="centrer()">🎯 Centrer</button>

<button onclick="ombre()">🌑 Ombre</button>

<button onclick="glow()">💡 Glow</button>

</div>
</div>


<!-- FORMATS -->

<div class="section">

<div class="title">📐 Formats</div>

<div class="grid">

<button onclick="format(1080,1350)">POST 4:5</button>

<button onclick="format(1080,1920)">STORY</button>

<button onclick="format(2480,3508)">A4</button>

</div>
</div>


<!-- SIGNATURE -->

<div class="section">

<div class="title">✍️ Identité</div>

<button class="green" style="width:100%" onclick="signature()">
✍️ AJOUTER MA SIGNATURE
</button>

</div>


<!-- EXPORT -->

<div class="section">

<div class="title">💾 Export rapide</div>

<div class="grid">

<button onclick="exporter('jpg')">JPG</button>

</div>

<div id="status" class="status">
● Connecté à Photopea
</div>

/* =====================================================
   COMMUNICATION AVEC PHOTOPEA
===================================================== */

function send(code){

    window.parent.postMessage(code,"*");

    document.getElementById("status").innerText =
    "● Action envoyée à Photopea";
}


/* =====================================================
   OUTILS COMMUNS
===================================================== */

function couleur(r,g,b){

    return `
    var c = new SolidColor();
    c.rgb.red = ${r};
    c.rgb.green = ${g};
    c.rgb.blue = ${b};
    `;
}

/* =====================================================
   CENTRER
===================================================== */

function centrer(){

send(`

var layer = app.activeDocument.activeLayer;

if(layer){

var b = layer.bounds;

var largeur = b[2] - b[0];

var hauteur = b[3] - b[1];

var x = (app.activeDocument.width - largeur)/2 - b[0];

var y = (app.activeDocument.height - hauteur)/2 - b[1];

layer.translate(x,y);

}

`);

}

/* =====================================================
   EXPORT
===================================================== */

function exporter(type){

var format;

if(type === "png"){

format = "png";

}

else if(type === "jpg"){

format = "jpg:0.9";

}

else if(type === "webp"){

format = "webp:0.9";

}

else{

format = "psd:true";

}

send(`

app.activeDocument.saveToOE(
    ${JSON.stringify(format)},
    0,
    true
);

`);

}
