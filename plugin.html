<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>VISUELS STUDIO 226 - Photopea Toolbox</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#07111f;
    color:white;
    width:310px;
    padding:12px;
}

.header{
    text-align:center;
    padding:10px;
    margin-bottom:10px;
    border-radius:12px;
    background:linear-gradient(135deg,#0b1f38,#123d67);
    border:1px solid #1e5d91;
}

.logo{
    font-size:17px;
    font-weight:900;
    letter-spacing:1px;
}

.sub{
    font-size:11px;
    color:#8fdcff;
    margin-top:3px;
}

.section{
    margin-bottom:9px;
    padding:9px;
    border-radius:11px;
    background:#0c1b2d;
    border:1px solid #183650;
}

.section-title{
    font-size:11px;
    font-weight:bold;
    color:#71d8ff;
    margin-bottom:7px;
    text-transform:uppercase;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:6px;
}

button{
    border:0;
    border-radius:8px;
    padding:9px 5px;
    background:#122b45;
    color:white;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#18517d;
}

.primary{
    background:linear-gradient(135deg,#008fd5,#0064a0);
}

.gold{
    background:linear-gradient(135deg,#b87900,#e4a928);
}

.purple{
    background:linear-gradient(135deg,#632c9c,#9c43c8);
}

.green{
    background:linear-gradient(135deg,#147449,#1ca866);
}

input,select{
    width:100%;
    border:1px solid #244761;
    background:#071523;
    color:white;
    padding:8px;
    border-radius:7px;
    margin-bottom:6px;
}

.status{
    text-align:center;
    font-size:10px;
    color:#7ce0a8;
    margin-top:7px;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">VISUELS STUDIO 226</div>
    <div class="sub">PHOTOPEA TOOLBOX</div>
</div>

<!-- MODÈLES -->
<div class="section">

<div class="section-title">🎨 Modèles d'affiches</div>

<div class="grid">

<button class="primary" onclick="templatePromo()">
🔥 PROMO
</button>

<button class="primary" onclick="templateFormation()">
🎓 FORMATION
</button>

<button class="primary" onclick="templateRestaurant()">
🍔 RESTAURANT
</button>

<button class="primary" onclick="templateBusiness()">
💼 BUSINESS
</button>

<button class="primary" onclick="templateTelephone()">
📱 TÉLÉPHONE
</button>

<button class="primary" onclick="templateEvent()">
🎉 ÉVÉNEMENT
</button>

<button class="primary" onclick="templateBirthday()">
🎂 ANNIVERSAIRE
</button>

<button class="primary" onclick="templateTech()">
💻 TECHNO
</button>

</div>
</div>


<!-- STICKERS -->
<div class="section">

<div class="section-title">🏷️ Stickers</div>

<div class="grid">

<button class="gold" onclick="sticker('PROMO')">
PROMO
</button>

<button class="gold" onclick="sticker('-30%')">
-30%
</button>

<button class="gold" onclick="sticker('-50%')">
-50%
</button>

<button class="gold" onclick="sticker('NOUVEAU')">
NOUVEAU
</button>

<button class="gold" onclick="sticker('BEST SELLER')">
BEST SELLER
</button>

<button class="gold" onclick="sticker('GRATUIT')">
GRATUIT
</button>

</div>
</div>


<!-- TEXTE -->
<div class="section">

<div class="section-title">🔤 Texte</div>

<input id="textInput" placeholder="Écris ton texte">

<div class="grid">

<button onclick="addText()">
➕ Texte
</button>

<button onclick="addBigText()">
🔠 XXL
</button>

<button class="purple" onclick="add3DText()">
🧊 3D
</button>

<button class="purple" onclick="addChromeText()">
✨ CHROME
</button>

</div>
</div>


<!-- EFFETS -->
<div class="section">

<div class="section-title">✨ Effets</div>

<div class="grid">

<button onclick="shadow()">
🌑 Ombre
</button>

<button onclick="glow()">
💡 Glow
</button>

<button onclick="duplicate()">
📋 Dupliquer
</button>

<button onclick="centerLayer()">
🎯 Centrer
</button>

</div>
</div>


<!-- FORMATS -->
<div class="section">

<div class="section-title">📐 Formats</div>

<div class="grid">

<button onclick="format(1080,1350)">
POST 4:5
</button>

<button onclick="format(1080,1920)">
STORY
</button>

<button onclick="format(1080,1080)">
CARRÉ
</button>

<button onclick="format(2480,3508)">
A4
</button>

</div>
</div>


<!-- SIGNATURE -->
<div class="section">

<div class="section-title">✍️ Signature</div>

<button class="green" style="width:100%" onclick="signature()">
Ajouter ma signature
</button>

</div>


<!-- EXPORT -->
<div class="section">

<div class="section-title">💾 Export</div>

<div class="grid">

<button onclick="exportFile('png')">
PNG
</button>

<button onclick="exportFile('jpg')">
JPG
</button>

<button onclick="exportFile('webp')">
WEBP
</button>

<button onclick="exportPSD()">
PSD
</button>

</div>

</div>

<div class="status" id="status">
● Extension connectée à Photopea
</div>

/* =========================
   COMMUNICATION PHOTOPEA
========================= */

function send(script){

    window.parent.postMessage(script,"*");

    document.getElementById("status").innerText =
        "● Action envoyée à Photopea";
}

/* =========================
   EFFETS
========================= */

function duplicate(){

send(`

var layer = app.activeDocument.activeLayer;

if(layer){
    layer.duplicate();
}

`);

}


function centerLayer(){

send(`

var layer = app.activeDocument.activeLayer;

if(layer){

var b = layer.bounds;

var x = (1080 - (b[2]-b[0])) / 2 - b[0];
var y = (1350 - (b[3]-b[1])) / 2 - b[1];

layer.translate(x,y);

}

`);

}


function shadow(){

send(`

var layer = app.activeDocument.activeLayer;

if(layer){

layer.style = {
    dropShadow:{
        enabled:true,
        opacity:50,
        distance:15,
        size:20
    }
};

}

`);

}


function glow(){

send(`

var layer = app.activeDocument.activeLayer;

if(layer){

        enabled:true,

};

`);

}

);
