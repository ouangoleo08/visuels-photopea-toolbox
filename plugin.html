<!DOCTYPE html>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:10px;
    width:320px;
    background:#07111f;
    color:white;

.header{
    text-align:center;
    padding:12px;
    margin-bottom:8px;
    border-radius:12px;
    background:linear-gradient(135deg,#07182d,#0c5685);
    border:1px solid #1b6f9f;

.logo{
    font-size:17px;
    font-weight:900;

}

.sub{

}

.title{
    color:#72dcff;
    font-size:10px;
    font-weight:bold;
    margin-bottom:6px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
}

button{
    border:0;
    border-radius:7px;
    padding:9px 4px;
    color:white;
    background:#122d47;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{

}

.blue{background:#0873ad}
.gold{background:#9a6900}
.purple{background:#66348e}
.green{background:#14774d}
.red{background:#963838}

input{
    width:100%;
    padding:8px;
    border-radius:7px;
    border:1px solid #244863;
    background:#06131f;
    color:white;
    margin-bottom:6px;
}

.status{
    text-align:center;
    font-size:10px;
    color:#70e2a3;
    padding:3px;
}

/* =====================================================
   DUPLIQUER
===================================================== */

function duplicate(){

send(`

if(app.activeDocument.activeLayer){

app.activeDocument.activeLayer.duplicate();

}

`);

}


/* =====================================================
   CENTRER
===================================================== */

function center(){

send(`

var layer=app.activeDocument.activeLayer;

if(layer){

var b=layer.bounds;

var w=b[2]-b[0];

var h=b[3]-b[1];

var x=(app.activeDocument.width-w)/2-b[0];

var y=(app.activeDocument.height-h)/2-b[1];

layer.translate(x,y);

}

`);

}


/* =====================================================
   FORMATS
===================================================== */

function formatDoc(w,h){

send(`

app.activeDocument.resizeImage(
UnitValue(${w},"px"),
UnitValue(${h},"px"),
null,
ResampleMethod.BICUBIC
);

`);

}

   SIGNATURE
===================================================== */

var layer=doc.artLayers.add();

layer.name="SIGNATURE VISUELS STUDIO 226";

c.rgb.red=255;

c.rgb.blue=255;

layer.textItem.position=[780,1295];

`);

}


/* =====================================================
   EXPORT
===================================================== */

function exportFile(type){

let format;

if(type==="png"){
format="png";
}

if(type==="jpg"){
format="jpg:0.9";
}

if(type==="webp"){
format="webp:0.9";
}

if(type==="psd"){
format="psd:true";
}

send(`

app.activeDocument.saveToOE(
${JSON.stringify(format)},
0,
true
);

`);

}
