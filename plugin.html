<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>VISUELS STUDIO 226 - Photopea Toolbox</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:10px;
    width:330px;
    background:#050b13;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.header{
    padding:16px 10px;
    margin-bottom:10px;
    text-align:center;
    border-radius:16px;
    background:
        linear-gradient(135deg,#071b2e,#075b88,#07182a);
    border:1px solid #219bd0;
    box-shadow:0 8px 25px rgba(0,0,0,.45);
}

.logo{
    font-size:17px;
    font-weight:900;
    letter-spacing:.8px;
}

.sub{
    margin-top:4px;
    font-size:9px;
    letter-spacing:1.5px;
    color:#79dcff;
}

.section{
    margin-bottom:8px;
    padding:9px;
    border-radius:12px;
    background:#0a1725;
    border:1px solid #18364e;
}

.title{
    margin-bottom:7px;
    color:#73dcff;
    font-size:10px;
    font-weight:900;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

button{
    border:1px solid rgba(255,255,255,.08);
    border-radius:8px;
    padding:10px 4px;
    color:#fff;
    background:#132b40;
    font-size:10px;
    font-weight:800;
    cursor:pointer;
}

button:hover{
    background:#1d5275;
}

.blue{
    background:linear-gradient(145deg,#087fbd,#064b72);
}

.gold{
    background:linear-gradient(145deg,#bb7e00,#704a00);
}

.purple{
    background:linear-gradient(145deg,#8144ad,#51286f);
}

.green{
    background:linear-gradient(145deg,#168d5a,#0b5b3b);
}

.red{
    background:linear-gradient(145deg,#ad4141,#6d2424);
}

input{
    width:100%;
    margin-bottom:7px;
    padding:10px;
    border-radius:8px;
    border:1px solid #28506a;
    background:#06111c;
    color:#fff;
    outline:none;
}

.status{
    padding:5px;
    text-align:center;
    color:#70e5a1;
    font-size:10px;
}

</style>
</head>

/* =====================================================
   CRÉER L'AFFICHE
===================================================== */

function createPoster(type){

    const d=DATA[type];
    const image=IMAGES[type];

    if(!d || !image){
        alert("Modèle introuvable.");
        return;
    }


    let r=d.accent[0];
    let g=d.accent[1];
    let b=d.accent[2];

    let dr=d.dark[0];
    let dg=d.dark[1];
    let db=d.dark[2];


    let script=`

/* =====================================================
   DOCUMENT
===================================================== */

app.documents.add(
1080,
1350,
72,
${JSON.stringify(d.title)}
);

var doc=app.activeDocument;


/* =====================================================
   COULEURS
===================================================== */

var bg=new SolidColor();

bg.rgb.red=${dr};
bg.rgb.green=${dg};
bg.rgb.blue=${db};


var accent=new SolidColor();

accent.rgb.red=${r};
accent.rgb.green=${g};
accent.rgb.blue=${b};


var white=new SolidColor();

white.rgb.red=255;
white.rgb.green=255;
white.rgb.blue=255;


var black=new SolidColor();

black.rgb.red=3;
black.rgb.green=5;
black.rgb.blue=9;


/* =====================================================
   FOND
===================================================== */

var background=doc.artLayers.add();

background.name="01 • FOND PREMIUM";

doc.selection.selectAll();

doc.selection.fill(bg);

doc.selection.deselect();


/* =====================================================
   IMAGE PRINCIPALE
===================================================== */

app.open(
${JSON.stringify(image)}
);

var source=app.activeDocument;

source.activeLayer.copy();

source.close(SaveOptions.DONOTSAVECHANGES);

doc.activate();

doc.paste();

var hero=doc.activeLayer;

hero.name="02 • IMAGE PRINCIPALE";


/* =====================================================
   REDIMENSIONNEMENT IMAGE
===================================================== */

var bounds=hero.bounds;

var iw=bounds[2]-bounds[0];

var ih=bounds[3]-bounds[1];

var scaleX=850/iw*100;

var scaleY=780/ih*100;

var scale=Math.max(scaleX,scaleY);

hero.resize(scale,scale,AnchorPosition.MIDDLECENTER);

hero.translate(
760-(hero.bounds[0]+hero.bounds[2])/2,
430-(hero.bounds[1]+hero.bounds[3])/2
);


/* =====================================================
   PANNEAU SOMBRE GAUCHE
===================================================== */

var panel=doc.artLayers.add();

panel.name="03 • PANNEAU TEXTE";

doc.selection.select([
[0,0],
[650,0],
[650,1350],
[0,1350]
]);

doc.selection.fill(black);

doc.selection.deselect();

panel.opacity=88;


/* =====================================================
   BANDE ACCENT
===================================================== */

var top=doc.artLayers.add();

top.name="04 • BANDE ACCENT";

doc.selection.select([
[0,0],
[1080,0],
[1080,20],
[0,20]
]);

doc.selection.fill(accent);

doc.selection.deselect();


/* =====================================================
   BADGE
===================================================== */

var badgeBg=doc.artLayers.add();

badgeBg.name="05 • BADGE";

doc.selection.select([
[55,90],
[300,90],
[300,155],
[55,155]
]);

doc.selection.fill(accent);

doc.selection.deselect();


var badge=doc.artLayers.add();

badge.kind=LayerKind.TEXT;

badge.name="06 • TEXTE BADGE";

badge.textItem.contents=${JSON.stringify(d.badge)};

badge.textItem.size=32;

badge.textItem.font="Arial-BoldMT";

badge.textItem.color=white;

badge.textItem.position=[75,108];


/* =====================================================
   TITRE
===================================================== */

var title=doc.artLayers.add();

title.kind=LayerKind.TEXT;

title.name="07 • TITRE PRINCIPAL";

title.textItem.contents=${JSON.stringify(d.title)};

title.textItem.size=67;

title.textItem.font="Arial-BoldMT";

title.textItem.color=white;

title.textItem.position=[55,225];


/* =====================================================
   LIGNE ACCENT
===================================================== */

var line=doc.artLayers.add();

line.name="08 • LIGNE ACCENT";

doc.selection.select([
[55,335],
[420,335],
[420,348],
[55,348]
]);

doc.selection.fill(accent);

doc.selection.deselect();


/* =====================================================
   SOUS-TITRE
===================================================== */

var subtitle=doc.artLayers.add();

subtitle.kind=LayerKind.TEXT;

subtitle.name="09 • SOUS TITRE";

subtitle.textItem.contents=${JSON.stringify(d.subtitle)};

subtitle.textItem.size=25;

subtitle.textItem.font="Arial-BoldMT";

subtitle.textItem.color=accent;

subtitle.textItem.position=[55,375];


/* =====================================================
   PRODUIT
===================================================== */

var product=doc.artLayers.add();

product.kind=LayerKind.TEXT;

product.name="10 • PRODUIT";

product.textItem.contents=${JSON.stringify(d.product)};

product.textItem.size=48;

product.textItem.font="Arial-BoldMT";

product.textItem.color=white;

product.textItem.position=[55,510];


/* =====================================================
   DESCRIPTION
===================================================== */

var description=doc.artLayers.add();

description.kind=LayerKind.TEXT;

description.name="11 • DESCRIPTION";

description.textItem.contents=${JSON.stringify(d.description)};

description.textItem.size=22;

description.textItem.font="Arial";

description.textItem.color=white;

description.textItem.position=[55,575];


/* =====================================================
   PRIX
===================================================== */

var priceBox=doc.artLayers.add();

priceBox.name="12 • BLOC PRIX";

doc.selection.select([
[55,650],
[455,765],
[55,765],
[55,650]
]);

doc.selection.fill(accent);

doc.selection.deselect();


var price=doc.artLayers.add();

price.kind=LayerKind.TEXT;

price.name="13 • PRIX";

price.textItem.contents=${JSON.stringify(d.price)};

price.textItem.size=49;

price.textItem.font="Arial-BoldMT";

price.textItem.color=white;

price.textItem.position=[78,685];


/* =====================================================
   CTA
===================================================== */

var ctaBox=doc.artLayers.add();

ctaBox.name="14 • BOUTON CTA";

doc.selection.select([
[55,805],
[500,900],
[55,900],
[55,805]
]);

doc.selection.fill(white);

doc.selection.deselect();


var cta=doc.artLayers.add();

cta.kind=LayerKind.TEXT;

cta.name="15 • CTA";

cta.textItem.contents=${JSON.stringify(d.cta)};

cta.textItem.size=24;

cta.textItem.font="Arial-BoldMT";

cta.textItem.color=black;

cta.textItem.position=[80,835];


/* =====================================================
   CONTACT
===================================================== */

var contact=doc.artLayers.add();

contact.kind=LayerKind.TEXT;

contact.name="16 • CONTACT";

contact.textItem.contents=${JSON.stringify(d.phone)};

contact.textItem.size=31;

contact.textItem.font="Arial-BoldMT";

contact.textItem.color=white;

contact.textItem.position=[55,1010];


/* =====================================================
   APPEL
===================================================== */

var call=doc.artLayers.add();

call.kind=LayerKind.TEXT;

call.name="17 • APPEL";

call.textItem.contents="CONTACTEZ-NOUS";

call.textItem.size=19;

call.textItem.font="Arial";

call.textItem.color=accent;

call.textItem.position=[57,1055];


/* =====================================================
   PETIT CADRE DÉCORATIF
===================================================== */

var deco=doc.artLayers.add();

deco.name="18 • DÉCORATION";

doc.selection.select([
[875,1120],
[1025,1120],
[1025,1270],
[875,1270]
]);

doc.selection.fill(accent);

doc.selection.deselect();

deco.opacity=35;


/* =====================================================
   SIGNATURE
===================================================== */

var signature=doc.artLayers.add();

signature.kind=LayerKind.TEXT;

signature.name="19 • SIGNATURE";

signature.textItem.contents="Visuels Studio 226";

signature.textItem.size=20;

signature.textItem.font="Arial-BoldMT";

signature.textItem.color=white;

signature.textItem.position=[770,1290];


/* =====================================================
   ORDRE FINAL
===================================================== */

doc.activeLayer=background;

`;

    send(script);

}

}

/* =====================================================
   CHROME
===================================================== */

function chromeText(){

    let t=document.getElementById("texte").value;

    if(!t){

        alert("Écris ton texte.");

        return;

    }

    send(`

var doc=app.activeDocument;

var shadow=doc.artLayers.add();

shadow.kind=LayerKind.TEXT;

shadow.name="CHROME • OMBRE";

shadow.textItem.contents=${JSON.stringify(t)};

shadow.textItem.size=100;

shadow.textItem.font="Arial-BoldMT";

var dark=new SolidColor();

dark.rgb.red=70;

dark.rgb.green=80;

dark.rgb.blue=95;

shadow.textItem.color=dark;

shadow.textItem.position=[108,410];


var face=doc.artLayers.add();

face.kind=LayerKind.TEXT;

face.name="CHROME • FACE";

face.textItem.contents=${JSON.stringify(t)};

face.textItem.size=100;

face.textItem.font="Arial-BoldMT";

var silver=new SolidColor();

silver.rgb.red=235;

silver.rgb.green=240;

silver.rgb.blue=250;

face.textItem.color=silver;

face.textItem.position=[100,400];

`);

}


/* =====================================================
   DUPLIQUER
===================================================== */

function duplicate(){

send(`

if(app.activeDocument.activeLayer){

app.activeDocument.activeLayer.duplicate();

}

`);

}


/* =====================================================
   CENTRER
===================================================== */

function center(){

send(`

var doc=app.activeDocument;

var layer=doc.activeLayer;

if(layer){

var b=layer.bounds;

var w=b[2]-b[0];

var h=b[3]-b[1];

var x=(doc.width-w)/2-b[0];

var y=(doc.height-h)/2-b[1];

layer.translate(x,y);

}

`);

}


/* =====================================================
   FORMAT
===================================================== */

function formatDoc(w,h){

send(`

app.activeDocument.resizeImage(
UnitValue(${w},"px"),
UnitValue(${h},"px"),
null,
ResampleMethod.BICUBIC
);

`);

}


/* =====================================================
   SIGNATURE
===================================================== */

function signature(){

send(`

var doc=app.activeDocument;

var layer=doc.artLayers.add();

layer.kind=LayerKind.TEXT;

layer.name="Visuels Studio 226";

layer.textItem.contents="Visuels Studio 226";

layer.textItem.size=20;

layer.textItem.font="Arial-BoldMT";

var c=new SolidColor();

c.rgb.red=255;

c.rgb.green=255;

c.rgb.blue=255;

layer.textItem.color=c;

layer.textItem.position=[770,1290];

`);

}


/* =====================================================
   EXPORT
===================================================== */

function exportFile(type){

    let format="png";

    if(type==="jpg"){
        format="jpg:0.9";
    }

    if(type==="webp"){
        format="webp:0.9";
    }

    if(type==="psd"){
        format="psd:true";
    }

    send(`

app.activeDocument.saveToOE(
${JSON.stringify(format)},
0,
true
);

`);

}
